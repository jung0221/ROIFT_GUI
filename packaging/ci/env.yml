# Conda environment for the Linux build (CI, and a convenient local one).
#
# Everything comes prebuilt from conda-forge because Debian/Ubuntu's apt VTK is
# Qt5-only and this app needs Qt6; apt cannot satisfy it at all. conda-forge also
# gives linuxdeploy a single controlled prefix to bundle into the AppImage.
#
# curl/file are needed by the AppImage step (linuxdeploy); numpy/simpleitk let
# the npz_import test actually run instead of skipping with exit code 77.
name: roift
channels:
  - conda-forge
dependencies:
  - cmake
  - ninja
  - cxx-compiler
  # Explicit because cxx-compiler 2.0 stopped pulling the binutils wrappers:
  # without it the env only has x86_64-conda-linux-gnu-ar, CMake finds no plain
  # `ar`, and every static library fails to link with CMAKE_AR-NOTFOUND.
  - binutils
  - qt6-main
  - vtk
  - itk
  - zlib
  - libgl-devel
  - curl
  - file
  - python
  - numpy
  - simpleitk
